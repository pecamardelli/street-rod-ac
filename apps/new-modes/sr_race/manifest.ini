; Street Corsa race: one street race against one rival, run and scored for the Street Corsa career.
;
; No BASE_MODE: the race.ini Street Corsa writes decides the session, a drag race (TYPE=7) or a one-lap
; race (TYPE=3), and a base mode would replace it. Checked in the game on 2026-09-24: with this manifest a
; drag session stays a drag session and physics.allowed() is true.
;
; Street Corsa installs this folder into extension\lua\new-modes\sr_race before every race and selects it
; with [RACE] __CM_CUSTOM_MODE=sr_race. Edit it in the repo (apps\new-modes\sr_race), not in the install:
; the next race puts the repo's copy back.

[ABOUT]
NAME = Street Corsa Race
AUTHOR = Street Corsa
VERSION = 3.0
DESCRIPTION = A Street Corsa street race: starts itself, judges crashes and false starts, reports to the career and quits.

[RULES]
; The physics API without the track opting in through its surfaces.ini: locking a crashed car's controls,
; holding a crashed AI, and (next) putting a car's damage back at the start
ALLOW_PHYSICS_ALTERATIONS=1
PENALTIES=0

[TWEAKS]
HIDE_PITCREW=1
DISABLE_FLAGS=YELLOW, BLUE
